[package]
name = "toufiq-portfolio"
version = "0.1.0"
edition = "2021"

[dependencies]
leptos = { version = "0.7.7", features = ["csr"] }
leptos_router = "0.7.7"
web-sys = { version = "0.3", features = [
    "Window",
    "Document",
    "Element",
    "HtmlElement",
    "HtmlInputElement",
    "HtmlTextAreaElement",
    "ScrollIntoViewOptions",
    "ScrollBehavior",
    "DomRect",
] }
wasm-bindgen = "0.2"
gloo-timers = { version = "0.3", features = ["futures"] }
console_error_panic_hook = "0.1"
log = "0.4"
console_log = "1"
